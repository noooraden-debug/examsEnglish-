<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محاكي الامتحان الوزاري - Nour Eddin</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f1f5f9; color: #1e293b; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #ffffff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 2px solid #334155; }
        .timer { position: sticky; top: 10px; background: #dc2626; color: #ffffff; padding: 15px; border-radius: 12px; text-align: center; font-size: 2rem; font-weight: 800; z-index: 100; margin-bottom: 30px; }
        h1 { text-align: center; color: #1e293b; font-weight: 800; border-bottom: 3px solid #334155; padding-bottom: 15px; }
        h2 { color: #4f46e5; font-weight: 800; margin-top: 30px; }
        .q-box { border-bottom: 2px dashed #cbd5e1; padding: 25px 0; }
        .q-text { font-size: 1.3rem; font-weight: 700; margin-bottom: 15px; }
        .options label { display: block; padding: 12px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 8px; margin: 5px 0; font-weight: 600; cursor: pointer; }
        .btn-action { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin: 5px; }
        .btn-ans { background: #16a34a; color: white; }
        .btn-trans { background: #0284c7; color: white; }
        .hidden-box { display: none; margin-top: 10px; padding: 10px; background: #f1f5f9; border-radius: 6px; font-weight: 700; }
    </style>
</head>
<body>

<div class="container">
    <div id="timer" class="timer">20:00</div>
    <h1>اختبار اللغة الإنجليزية الوزاري</h1>
    
    <div id="quiz-content"></div>
    
    <button style="width:100%; padding:20px; background:#4f46e5; color:white; font-size:1.4rem; font-weight:800; border:none; border-radius:12px; cursor:pointer;" onclick="finishExam()">إنهاء الامتحان وتصحيح الأجوبة</button>
    <div id="result" style="text-align:center; font-size:1.8rem; margin-top:30px; font-weight:800;"></div>
</div>

<script>
    let timeLeft = 1200;
    const questions = [
        { section: "A", q: "1. Life in the space city will be --.", options: ["risky", "difficult", "ordinary", "strange"], ans: 2, trans: "الحياة في مدينة الفضاء ستكون -- (عادية).", mark: 10 },
        { section: "A", q: "2. Living on a space station will -- than on the moon.", options: ["cost less money", "be cheaper", "be more expensive", "be easier"], ans: 3, trans: "العيش في محطة فضاء سيكون -- من العيش على القمر (أسهل).", mark: 10 },
        { section: "A", q: "3. People in the space city will get water from --.", options: ["a fresh river", "a large ocean", "a deep well", "a huge area of ice"], ans: 3, trans: "سيحصل الناس على الماء من -- (مساحة ضخمة من الجليد).", mark: 10 },
        { section: "A", q: "4. The space city will have -- in it.", options: ["glass wheels", "treasures", "different buildings", "no inhabitants"], ans: 2, trans: "مدينة الفضاء ستحتوي على -- (مبانٍ مختلفة).", mark: 10 },
        { section: "A", q: "5. Inhabitants inside the buildings will breathe --.", options: ["using special tools", "like on Earth", "by wearing space suits", "through helmets"], ans: 1, trans: "سيتنفس السكان -- (مثلما على الأرض).", mark: 10 },
        { section: "B", q: "6. Selfies are usually taken with a smart phone or a digital camera. (True/False)", options: ["True", "False"], ans: 0, trans: "عادةً ما يتم التقاط السيلفي بهاتف ذكي أو كاميرا رقمية.", mark: 10 },
        { section: "B", q: "7. Marat Dupri used safety equipment while climbing. (True/False)", options: ["True", "False"], ans: 1, trans: "مارات دوبري استخدم معدات أمان أثناء التسلق (خطأ).", mark: 10 },
        { section: "B", q: "8. Many people followed Marat Dupri to take incredible views. (True/False)", options: ["True", "False"], ans: 0, trans: "تبع الكثيرون مارات دوبري للحصول على مناظر رائعة.", mark: 10 },
        { section: "B", q: "9. Why did Marat Dupri climb higher and higher structures?", options: ["To have fun", "To get incredible views", "To earn money", "To use his camera"], ans: 1, trans: "لماذا تسلق مارات دوبري مباني أعلى؟ (للحصول على مناظر رائعة).", mark: 10 },
        { section: "B", q: "10. What are selfies often shared on?", options: ["Papers", "Books", "Social media", "News"], ans: 2, trans: "على ماذا يتم مشاركة السيلفي غالباً؟ (على التواصل الاجتماعي).", mark: 10 }
    ];

    const area = document.getElementById('quiz-content');
    let currentSection = "";
    questions.forEach((item, i) => {
        if(item.section !== currentSection) {
            area.innerHTML += `<h2>القسم ${item.section}</h2>`;
            currentSection = item.section;
        }
        area.innerHTML += `
            <div class="q-box" id="q${i}">
                <p class="q-text">${i+1}. ${item.q}</p>
                <div class="options">${item.options.map((opt, j) => `<label><input type="radio" name="q${i}" value="${j}"> ${opt}</label>`).join('')}</div>
                <button class="btn-action btn-ans" onclick="document.getElementById('a${i}').style.display='block'">إظهار الإجابة</button>
                <button class="btn-action btn-trans" onclick="document.getElementById('t${i}').style.display='block'">إظهار الترجمة</button>
                <div id="a${i}" class="hidden-box" style="color:green;">الإجابة الصحيحة: ${item.options[item.ans]}</div>
                <div id="t${i}" class="hidden-box" style="color:blue;">${item.trans}</div>
                <div class="feedback"></div>
            </div>`;
    });

    function finishExam() {
        let total = 0;
        questions.forEach((item, i) => {
            const selected = document.querySelector(`input[name="q${i}"]:checked`);
            const feedback = document.querySelector(`#q${i} .feedback`);
            if(selected && parseInt(selected.value) === item.ans) {
                total += item.mark;
                feedback.innerHTML = '<span style="color:green; font-weight:800;">✔ إجابة صحيحة</span>';
            } else {
                feedback.innerHTML = '<span style="color:red; font-weight:800;">✘ إجابة خاطئة</span>';
            }
        });
        document.getElementById('result').innerHTML = `نتيجتك النهائية: ${total} من 100`;
    }

    setInterval(() => {
        if(timeLeft <= 0) finishExam();
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        document.getElementById('timer').innerHTML = `${m}:${s < 10 ? '0'+s : s}`;
        timeLeft--;
    }, 1000);
</script>

</body>
</html>
